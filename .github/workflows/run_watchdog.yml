name: Missed-Run Watchdog

on:
  schedule:
    # Tue-Sat 02:00 UTC — runs the morning after each US-market scan
    # (daily_scan.yml runs Mon-Fri 22:30 UTC), so there's always a fresh
    # day's api_usage row to check by the time this fires.
    - cron: '0 2 * * 2-6'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run watchdog
        env:
          TURSO_DATABASE_URL:   ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:     ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
        run: python scripts/run_watchdog.py
